roduct/style/color/landing/typography domains in parallel, applies reasoning rules from `ui-reasoning.csv`, and returns pattern, style, colors, typography, effects, and anti-patterns to avoid.\n\n### Step 2b: Persist Design System (Master + Overrides Pattern)\n\nTo save the design system for retrieval across sessions, add `--persist` and `--output-dir` pointed at the project root:\n\n```bash\npython \"\u003cskill_dir\u003e/scripts/search.py\" \"\u003cquery\u003e\" --design-system --persist -p \"Project Name\" --output-dir \"\u003cproject-root\u003e\"\n```\n\nThis creates:\n- `design-system/\u003cproject-slug\u003e/MASTER.md` — Global Source of Truth\n- `design-system/\u003cproject-slug\u003e/pages/` — Folder for page-specific overrides\n\nIf `MASTER.md` already exists, `--persist` skips writing unless you also pass `--force`.\n\n### Step 2c: Design Dials (optional)\n\nThree optional 1-10 sliders that tune `--design-system` output:\n\n```bash\npython \"\u003cskill_dir\u003e/scripts/search.py\" \"\u003cquery\u003e\" --design-system --variance \u003c1-10\u003e --motion \u003c1-10\u003e --density \u003c1-10\u003e\n```\n\n| Dial | Low (1-3) | Mid (4-7) | High (8-10) |\n|------|-----------|-----------|-------------|\n| `--variance` | Centered / minimal | Balanced / modern | Bold / asymmetric |\n| `--motion` | Subtle micro-interactions | Standard scroll/stagger | Complex choreography |\n| `--density` | Spacious (24-96px) | Standard (16-64px) | Dense/dashboard (8-32px) |\n\n### Step 3: Supplement with Detailed Searches (as needed)\n\n```bash\npython \"\u003cskill_dir\u003e/scripts/search.py\" \"\u003ckeyword\u003e\" --domain \u003cdomain\u003e [-n \u003cmax_results\u003e]\n```\n\n| Need | Domain | Example |\n|------|--------|---------|\n| Product type patterns | `product` | `--domain product \"entertainment social\"` |\n| More style options | `style` | `--domain style \"glassmorphism dark\"` |\n| Color palettes | `color` | `--domain color \"entertainment vibrant\"` |\n| Font pairings | `typography` | `--domain typography \"playful modern\"` |\n| Individual Google Fonts | `google-fonts` | `--domain google-fonts \"sans serif popular variable\"` |\n| Chart recommendations | `chart` | `--domain chart \"real-time dashboard\"` |\n| UX best practices | `ux` | `--domain ux \"animation accessibility\"` |\n| Landing page structure | `landing` | `--domain landing \"hero social-proof\"` |\n| Icon recommendations | `icons` | `--domain icons \"navigation outline\"` |\n| GSAP animation presets | `gsap` | `--domain gsap \"scroll reveal stagger\"` |\n| React/Next.js performance | `react` | `--domain react \"rerender memo list\"` |\n| App/native interface guidelines | `web` | `--domain web \"accessibilityLabel touch safe-areas\"` |\n\n### Step 4: Stack Guidelines\n\n```bash\npython \"\u003cskill_dir\u003e/scripts/search.py\" \"\u003ckeyword\u003e\" --stack \u003cstack\u003e\n```\n\n**Available stacks:** `react`, `nextjs`, `vue`, `svelte`, `astro`, `nuxtjs`, `nuxt-ui`, `angular`, `laravel`, `swiftui`, `react-native`, `flutter`, `jetpack-compose`, `html-tailwind`, `shadcn`, `threejs`, `javafx`, `wpf`, `winui`, `avalonia`, `uno`, `uwp`.\n\n---\n\n## If a search returns 0 results\n\nDo not fabricate output. Instead:\n1. Retry once with broader or differently-worded keywords.\n2. If still empty, fall back to the priority table above and say explicitly that this recommendation came from the built-in defaults, not a database match.\n3. Never present a 0-result search as if it returned data.\n\n## Tips for Better Results\n\n- Use **multi-dimensional keywords** — combine product + industry + tone + density\n- Try different phrasings for the same need\n- Use `--design-system` first for full recommendations, then `--domain` to deep-dive\n- Pass the detected stack explicitly for implementation-specific guidance\n\n| Problem | What to Do |\n|---------|------------|\n| Can't decide on style/color | Re-run `--design-system` with different keywords |\n| Dark mode contrast issues | `references/quick-reference.md` §6 |\n| Animations feel unnatural | `references/quick-reference.md` §7 |\n| Form UX is poor | `references/quick-reference.md` §8 |\n| Navigation feels confusing | `references/quick-reference.md` §9 |\n| Layout breaks on small screens | `references/quick-reference.md` §5 |\n| Performance / jank | `references/quick-reference.md` §3 |\n\n## Before Delivering App UI\n\nRead `references/pro-rules.md` and run through its canonical Pre-Delivery Checklist.\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "code-iteration-optimization-specialist", "title": "code-iteration-optimization-specialist", "description": "Expert in iteratively optimizing MATLAB/Python code with strict version control, Chinese documentation, and stability guarantees.", "category": "engineering", "audience": "codex-project", "tags": ["matlab", "python", "optimization"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/code-iteration-optimization-specialist", "full_content": "﻿---\nname: code-iteration-optimization-specialist\ndescription: Expert in iteratively optimizing MATLAB/Python code with strict version control, Chinese documentation, and stability guarantees.\ncategory: engineering\naudience: codex-project\ntags: [matlab, python, optimization]\nstatus: active\nscore: 10.0\n---\n\n# Code Iteration Optimization Specialist\n\nYou are an expert acting as a \"Code Iteration Optimization Specialist\". Your goal is to iterate on existing codebases while maintaining stability and enhancing clarity.\n\n## Core Responsibilities\n\n1.  **Understand \u0026 Roleplay**:\n\n    - Carefully read attached code to understand function and logic.\n    - Adopt the role of a specialist to communicate efficiently about the code's domain.\n\n2.  **Strict Coding Standards (User-Defined)**:\n    - **Version Control**: ALWAYS prompt to rename files with a new version number (e.g., `_v1.0` -\u003e `_v1.1`) for every iteration.\n    - **Chinese Documentation**:\n      - **File Header**: Must include:\n        - Overall key functionality.\n        - Specific content of this iteration (what changed).\n      - **Line-by-Line**: Provide Chinese comments for _every_ significant line of code explaining its function.\n    - **Non-Destructive Iteration**:\n      - **Do NOT** change the previous version's working functions, layout, or labels unless explicitly asked.\n      - **Focus**: Only modify the specific parts related to the new requirement or bug fix.\n      - **Risk Warning**: If a new feature requires a fundamental architectural change that breaks the old layout/logic, you MUST inform the user and state the risks _before_ proceeding.\n    - **Interaction Design**:\n      - Design human-computer interaction logic based on a deep understanding of user needs.\n      - Prioritize simple, elegant layouts and labeling.\n\n## Workflow\n\n1.  **Analysis**: Read the code and user request.\n2.  **Plan**: Propose the specific changes and the new version number.\n3.  **Execute**: Apply changes to the _new_ version of the file.\n4.  **Verify**: Ensure no regression in existing features (visually or logically).\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "cst-advanced-geometry-operations", "title": "CST Advanced Geometry Operations", "description": "Use when an AI agent must create, parameterize, validate, or debug complex CST Studio Suite geometry operations beyond primitives, including native cylindrical Bend, local coordinate systems, transforms, booleans, arrays, sweep/loft sequencing, sheet-versus-solid branches, and planar-to-curved state changes through Python-injected History VBA.", "category": "engineering", "audience": "codex-project", "tags": ["cst", "geometry", "history-list", "python", "vba", "parametric-modeling"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/cst-advanced-geometry-operations", "full_content": "---\nname: cst-advanced-geometry-operations\ntitle: CST Advanced Geometry Operations\ndescription: Use when an AI agent must create, parameterize, validate, or debug complex CST Studio Suite geometry operations beyond primitives, including native cylindrical Bend, local coordinate systems, transforms, booleans, arrays, sweep/loft sequencing, sheet-versus-solid branches, and planar-to-curved state changes through Python-injected History VBA.\ncategory: engineering\naudience: codex-project\ntags: [cst, geometry, history-list, python, vba, parametric-modeling]\nstatus: active\nscore: 10.0\n---\n\n# CST Advanced Geometry Operations\n\nUse this skill with `cst-control-skill` and `cst-history-macro-skill` whenever\nthe geometry contains a native operation whose result depends on selected\nobjects, coordinate systems, operation order, or topology.\n\n## Decision path\n\n1. Need a rebuildable in-CST shape? Use CST primitives, curves, sheets, solids,\n   and recorded History operations.\n2. Need a planar panel bent into an arc or cylinder? Build the planar geometry\n   first, then use the native cylindrical Bend workflow below.\n3. Need Boolean, Transform, Mirror, Array, Sweep, Loft, Blend, or another\n   native operation? Record that exact operation from the active CST version\n   before automating it.\n4. Need only visual exchange geometry? Use imported mesh and state explicitly\n   that it is not internally parameter-rebuildable.\n\n## Mandatory operation ledger\n\nBefore writing VBA, define:\n\n- input object names/components and whether each is a sheet or solid;\n- active coordinate system, operation axis, reference point, and sign\n  convention;\n- user parameters, derived parameters, bounds, and invalid states;\n- output object names and whether inputs are consumed by the operation;\n- three rebuild checks: nominal, boundary, and a changed-parameter state.\n\nWrite each logical operation into an individual named History item. Never merge\nunrelated geometry construction, selection, and solver setup in one item.\n\n## Native cylindrical Bend workflow\n\n1. Generate and verify all flat strips or panels, with deterministic names.\n2. Expose `panel_arc_deg`, `layer0_radius`, layer reference spacing, and the\n   derived unfolded length as CST parameters.\n3. For bend angles use the state convention: `0` flat, `(0, 360)` open arc,\n   `360` closed cylinder. Reject values outside `[0, 360]`; require positive\n   radius for nonzero angles.\n4. Recompute the complete selected-object set whenever panel length or strip\n   count is parameter dependent. Do not assume the initial object count.\n5. Activate a local WCS at the selected bend reference plane, perform the\n   recorded native Bend, restore the global WCS, save, and rebuild.\n6. Test `0°`, one open angle such as `90°`, and `360°`; inspect the CST model\n   tree and History after each test.\n\nUse the verified CST 2026/SP2 Bend pattern in\n`references/native-operations.md`. Treat it as a starting pattern only: still\nrecord GUI History before applying it to a new topology.\n\n## Other native operations\n\nFor Boolean, Transform, Mirror, Array, Sweep, Loft, Blend, Fillet, and Chamfer:\n\n1. Perform one manual GUI operation on a disposable project copy.\n2. Copy the exact generated History block.\n3. Move dimensions to named CST parameters; preserve selection order and WCS.\n4. Parameterize only values proven to rebuild correctly.\n5. Test the operation alone before chaining it with another native operation.\n\nDo not use a command name found online as proof of valid CST VBA syntax. Object\nselection and sheet/solid behavior must be verified in the installed CST build.\n\n## Failure isolation\n\n- If History fails, reduce to the last successful History item plus one new\n  operation and inspect the first CST error.\n- If an update changes the number of generated strips, regenerate the selection\n  list before a Bend, Boolean, or grouping operation.\n- If geometry deforms around the wrong axis, verify local WCS origin, U vector,\n  normal, and restored global WCS.\n- If a sheet operation fails on solids or vice versa, keep separate generation\n  branches; never sweep metal thickness through zero in one model state.\n- Keep ports, boundaries, mesh, monitors, and solver setup outside geometry\n  History until the geometry states rebuild successfully.\n\n## Completion evidence\n\nReport the saved `.cst` path, the final History captions, parameter values for\neach tested state, whether the model was visually inspected, and any unverified\noperations left for GUI recording.\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "cst-control-skill", "title": "CST Studio Suite Python Control", "description": "Use when an AI agent needs to connect to, open, create, save, or inspect CST Studio Suite 2026/SP2 projects through Python, including CST installation discovery, cst.interface/cst.results imports, script execution, and automation failure diagnosis.", "category": "engineering", "audience": "codex-project", "tags": ["cst", "python", "electromagnetic", "antenna", "automation", "parametric-modeling"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/cst-control-skill", "full_content": "---\nname: cst-control-skill\ntitle: CST Studio Suite Python Control\ndescription: Use when an AI agent needs to connect to, open, create, save, or inspect CST Studio Suite 2026/SP2 projects through Python, including CST installation discovery, cst.interface/cst.results imports, script execution, and automation failure diagnosis.\ncategory: engineering\naudience: codex-project\ntags: [cst, python, electromagnetic, antenna, automation, parametric-modeling]\nstatus: active\nscore: 10.0\n---\n\n# CST Control Skill\n\nUse this skill before generating CST modeling code. The goal is to make the CST\ncontrol channel repeatable so the agent can focus on geometry and RF intent.\n\n## Baseline\n\n1. Work on Windows with CST Studio Suite 2026 SP2.\n2. Prefer the CST-bundled Python at:\n   `F:\\EDA\\CST Studio Suite 2026\\Python\\python.exe`\n   when available.\n3. Do not hard-code that path in reusable scripts. Discover the install folder\n   from `CST_STUDIO_SUITE_2026`, `CST_INSTALL_DIR`, or the Windows uninstall\n   registry key.\n4. Add `\u003cinstall\u003e/AMD64/python_cst_libraries` to `sys.path` before importing\n   `cst` if the Python process did not already get that path from CST.\n\n## Standard Commands\n\nFrom the project root:\n\n```powershell\n\u0026 '\u003cCST_INSTALL\u003e\\Python\\python.exe' scripts\\cst_env_check.py\n\u0026 '\u003cCST_INSTALL\u003e\\Python\\python.exe' scripts\\create_minimal_brick.py --project .\\test.cst\n\u0026 '\u003cCST_INSTALL\u003e\\Python\\python.exe' scripts\\create_patch_antenna.py --project .\\test.cst\n\u0026 '\u003cCST_INSTALL\u003e\\Python\\python.exe' scripts\\create_saddle_lens_demo.py --project .\\test.cst --nx 7 --ny 7\n```\n\nUse `--cst-install \"\u003cfolder\u003e\"` only when auto-discovery fails.\n\n## Python Control Pattern\n\n```python\nfrom pathlib import Path\n\nfrom cst_common import ensure_cst_python_path, open_or_create_mws, add_history\n\nensure_cst_python_path()\nde, prj = open_or_create_mws(Path(\"test.cst\"))\nprj.model3d.add_to_history(\"AI operation name\", \"... CST VBA commands ...\")\nprj.save(str(Path(\"test.cst\").resolve()))\n```\n\nUse `DesignEnvironment.connect_to_any_or_new()` when you are allowed to open or\nreuse CST. If several CST frontends are running and connection is ambiguous,\nstart from a clean CST session or pass the project path explicitly.\n\n## Complex-operation execution contract\n\nFor Bend, boolean, transform, array, or coordinate-system work, keep the\nautomation transport deliberately simple:\n\n1. Build or open a copy of the project, never the only validated source file.\n2. Make one operation in CST's GUI when its History syntax is not already\n   verified, then capture the exact generated History block.\n3. Inject one named operation per `add_to_history` item and save immediately.\n4. Reopen the project or change one parameter and rebuild before adding the\n   next operation.\n5. Report the output project path, latest History caption, and the tested\n   parameter states.\n\nThis separates Python connection failures from CST geometry failures and keeps\ncomplex modeling reproducible.\n\n## Result Reading\n\nUse `cst.results.ProjectFile` after a solver run when result data exists:\n\n```python\nfrom cst.results import ProjectFile\n\nproject = ProjectFile(\"test.cst\", allow_interactive=True)\nitem = project.get_3d().get_result_item(r\"1D Results\\S-Parameters\\S1,1\")\n```\n\nIf the result path fails, inspect the CST result tree in the GUI and update the\npath; do not guess silently.\n\n## Failure Checklist\n\n- `ModuleNotFoundError: cst`: run CST-bundled Python or add\n  `\u003cinstall\u003e/AMD64/python_cst_libraries`.\n- `running_design_environments()` returns empty while CST is visible: the\n  frontend may not be registered for automation in the current session; use\n  `connect_to_any_or_new()` or open the target project through the script.\n- Project opens but history is not visible: ensure commands are sent through\n  `model3d.add_to_history(title, vba)`, then save.\n- CST hangs on startup: check license availability and whether an old modal\n  dialog is waiting in CST.\n- Result export fails: confirm the solver has completed and the result path\n  exists.\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "cst-history-macro-skill", "title": "CST History List and VBA Modeling", "description": "Use when an AI agent must create or modify CST Studio Suite 2026 geometry through History List/VBA snippets injected from Python, including CST parameters, materials, primitives, curves, lofts, boolean operations, transforms, imports, rebuilds, and History debugging.", "category": "engineering", "audience": "codex-project", "tags": ["cst", "history-list", "vba", "python", "geometry", "parametric-modeling"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/cst-history-macro-skill", "full_content": "---\nname: cst-history-macro-skill\ntitle: CST History List and VBA Modeling\ndescription: Use when an AI agent must create or modify CST Studio Suite 2026 geometry through History List/VBA snippets injected from Python, including CST parameters, materials, primitives, curves, lofts, boolean operations, transforms, imports, rebuilds, and History debugging.\ncategory: engineering\naudience: codex-project\ntags: [cst, history-list, vba, python, geometry, parametric-modeling]\nstatus: active\nscore: 10.0\n---\n\n# CST History Macro Skill\n\nUse CST's History List as the source of truth for modeling commands. Python is\nthe transport layer; CST VBA history commands are the modeling layer.\n\n## Workflow\n\n1. If a CST command is uncertain, perform it once in the CST GUI.\n2. Open the History List and copy the generated command block.\n3. Replace fixed dimensions with CST parameters when the model needs sweeps.\n4. Inject the block from Python:\n\n```python\nprj.model3d.add_to_history(\"meaningful operation title\", vba_block)\n```\n\n5. Save the `.cst`, reopen or rebuild if needed, and inspect the model tree.\n\nFor recorded snippets saved as files, use:\n\n```powershell\n\u0026 '\u003cCST_INSTALL\u003e\\Python\\python.exe' scripts\\apply_history_snippet.py --project .\\test.cst --title \"AI recorded operation\" --snippet examples\\history_snippets\\operation.vba --close\n```\n\n## Parameter Descriptions\n\nFor optimization-ready CST models, prefer `StoreParameterWithDescription`.\nDescriptions should be Chinese, concise, and useful in the CST parameter table:\n\n```vb\nStoreParameterWithDescription \"sub_h\", \"1.6\", \"介质基板厚度，增大时馈线与贴片离地高度增加。\"\nStoreParameterWithDescription \"patch_w\", \"30\", \"贴片沿 X 方向的宽度，主要影响谐振频率和输入阻抗。\"\n```\n\nGood descriptions state:\n\n- Which physical part or setup item the parameter controls.\n- The unit or implied unit when helpful.\n- What happens when the value increases or decreases.\n\nAvoid putting one-off project notes in this skill. Keep project-specific\nparameter names and formulas in that project's own documentation.\n\n## Advanced native operations\n\nTreat CST native operations as a recorded-operation workflow, not as an API to\nguess. Use one History item for each logical operation and keep the pre-operation\nsolids named and selectable.\n\n1. Build the parameterized flat or primitive geometry first.\n2. In CST GUI, perform the operation once and copy its History item verbatim.\n3. Replace dimensions with existing CST parameter names; retain the GUI's\n   object-selection and WCS setup commands.\n4. Rebuild each representative state before composing a second operation.\n\nFor a verified native cylindrical-bend pattern, select every named solid with\n`Bending.Shape`, activate a local WCS at the bend reference plane, then call\n`Bending.FlexBend` with `.Centralized \"True\"` and a parameterized radius. The\nfull audited pattern and its state checks are in\n`../cst-advanced-geometry-operations/references/native-operations.md`.\n\nDo not invent History syntax for Boolean, Transform, Mirror, Array, Sweep, or\nBlend operations. Record it from the target CST version first; selection order,\nactive WCS, and body-vs-sheet behavior are operation-specific.\n\n## Reliable Primitive Pattern\n\n```vb\nStoreParameterWithDescription \"body_x\", \"10\", \"实体沿 X 方向的尺寸。\"\n\nWith Brick\n    .Reset\n    .Name \"object_name\"\n    .Component \"component_name\"\n    .Material \"PEC\"\n    .Xrange \"-body_x/2\", \"body_x/2\"\n    .Yrange \"-5\", \"5\"\n    .Zrange \"0\", \"1\"\n    .Create\nEnd With\n```\n\nSet units and frequency range near the start of every generated model. Create\nnamed materials before objects that reference them. Use short, descriptive\nHistory titles because they become the audit trail.\n\n## CST-Native Smooth Geometry Pattern\n\nWhen geometry must stay editable and sweepable inside CST, use CST-native\nparameters and geometry commands rather than imported mesh. For smooth freeform\nor analytical surfaces, a robust general pattern is:\n\n1. Store controlling CST parameters with Chinese descriptions.\n2. Create multiple `Polygon3D` profile curves whose point coordinates contain\n   CST parameter expressions.\n3. Use `.SetInterpolation \"Spline\"` on profiles that should be smooth.\n4. Use `LoftCurves` with `.Solid \"True\"` to create a solid.\n5. Rebuild after changing parameters.\n\nGeneric shape:\n\n```vb\nStoreParameterWithDescription \"profile_w\", \"40\", \"轮廓宽度，增大时实体横向尺寸变大。\"\nStoreParameterWithDescription \"profile_h\", \"10\", \"轮廓高度，增大时顶面或外形高度增加。\"\n\nCurve.NewCurve \"profile_curve_00\"\nWith Polygon3D\n    .Reset\n    .Name \"profile_00\"\n    .Curve \"profile_curve_00\"\n    .SetInterpolation \"Spline\"\n    .Point \"-profile_w/2\", \"-10\", \"0\"\n    .Point \"-profile_w/2\", \"-10\", \"profile_h\"\n    .Point \" profile_w/2\", \"-10\", \"profile_h\"\n    .Point \" profile_w/2\", \"-10\", \"0\"\n    .Point \"-profile_w/2\", \"-10\", \"0\"\n    .Create\nEnd With\n\nWith LoftCurves\n    .Reset\n    .Name \"lofted_solid\"\n    .Component \"AI_Generated\"\n    .Material \"material_name\"\n    .Solid \"True\"\n    .MinimizeTwist \"False\"\n    .AddCurve \"profile_curve_00:profile_00\"\n    .AddCurve \"profile_curve_01:profile_01\"\n    .Create\nEnd With\n```\n\nPractical rules verified in CST 2026 SP2:\n\n- `Polygon3D.Point` can accept string expressions containing CST parameters.\n- `Polygon3D.SetInterpolation \"Spline\"` works for smooth profile curves.\n- `LoftCurves` supports `.Solid \"True\"`, `.AddCurve`, and `.Create`.\n- Avoid degenerate profiles, such as zero width or coincident control points.\n- Avoid complex nested functions inside `Polygon3D.Point`; precompute constants\n  in Python and keep CST expressions simple.\n\n## Imported Mesh Fallback\n\nUse STL/OBJ import when the goal is geometry exchange, visual inspection, or a\nfallback for fragile native construction. Imported mesh geometry is not reshaped\nby changing CST parameters; geometry sweeps require regenerating and reimporting\nthe mesh.\n\nSTL import pattern:\n\n```vb\nWith STL\n    .Reset\n    .FileName (\"C:\\\\path\\\\to\\\\model.stl\")\n    .Id (1)\n    .Name (\"imported_model\")\n    .Component (\"AI_Imported\")\n    .ImportToActiveCoordinateSystem (False)\n    .Read\nEnd With\n```\n\nOBJ import pattern:\n\n```vb\nWith OBJ\n    .Reset\n    .FileName (\"C:\\\\path\\\\to\\\\model.obj\")\n    .ScaleToUnit \"False\"\n    .CopyFileToProject \"True\"\n    .Read\nEnd With\n```\n\nFor OBJ, use `With OBJ ... .Read`; do not use guessed forms such as\n`OBJImport` or `.Import`.\n\n## Debugging\n\n- If a VBA block fails, reduce it to the last successful History item plus one\n  new operation.\n- Check quotation marks: CST VBA expects strings like `\"PEC\"`; Python raw\n  strings help avoid accidental escaping.\n- If parameter changes do not affect geometry, run `Rebuild`.\n- If an object name already exists, delete it intentionally first or use a new\n  name; do not rely on silent overwrite.\n- For repeated test runs, start from a fresh `.cst` or record a cleanup History\n  block for the component being regenerated.\n- Treat ports, boundary spacing, and solver setup as separate iterations after\n  geometry is visually correct. Copy exact commands from GUI History when the\n  command depends on selected faces, picked points, or solver-specific objects.\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "cst-parametric-modeling", "title": "CST Parametric Modeling", "description": "Use when building or iterating CST models that must retain internal parameter optimization, including CST Parameter List variables, derived parameters, rebuildable History VBA geometry, Parameter Sweep, Optimizer, and Tuning workflows.", "category": "engineering", "audience": "codex-project", "tags": ["cst", "parametric-modeling", "parameter-sweep", "optimizer", "tuning", "python", "vba"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/cst-parametric-modeling", "full_content": "---\nname: cst-parametric-modeling\ntitle: CST Parametric Modeling\ndescription: Use when building or iterating CST models that must retain internal parameter optimization, including CST Parameter List variables, derived parameters, rebuildable History VBA geometry, Parameter Sweep, Optimizer, and Tuning workflows.\ncategory: engineering\naudience: codex-project\ntags: [cst, parametric-modeling, parameter-sweep, optimizer, tuning, python, vba]\nstatus: active\nscore: 10.0\n---\n\n# CST Parametric Modeling Skill\n\n## When to Use\n\nUse this skill when any of the following applies:\n\n- The user wants fully parameterized modeling inside CST.\n- The user will later use `Parameter Sweep`, `Optimizer`, or `Tuning`.\n- The geometry is complex enough that manual construction is expensive.\n- Externally imported geometry cannot satisfy later optimization requirements.\n\n## Core Principle\n\nKeep the following priorities fixed:\n\n1. Preserve parameters in the CST Parameter List.\n2. Perform geometry rebuilds inside CST.\n3. Split complex boundaries into stable patches.\n4. Prefer numeric History operations over giant symbolic expression blocks.\n\n## Default Stack\n\n- External driver: `Python`\n- CST interface: `cst.interface`\n- Internal rebuild: `History VBA`\n- Surface construction: `Polygon3D + CoverCurve`\n\n## Workflow\n\n1. Define user parameters and derived parameters.\n2. Decide whether the target structure needs to be split into multiple patches.\n3. Open or create the CST project with Python.\n4. Write user parameters into the CST Parameter List.\n5. Inject rebuildable History VBA.\n6. Read parameters in History VBA and generate geometry numerically.\n7. Add adaptive sampling and point-count limits for high-curvature or\n   high-frequency boundaries.\n8. Produce a reusable `.cst` template.\n\n## Geometry-state parameters\n\nWhen a model can switch between planar and curved forms, model the state inside\nCST rather than maintaining unrelated geometry files. Use an explicit state\nparameter and derived quantities, for example:\n\n- `panel_arc_deg = 0` for a flat panel, `0 \u003c panel_arc_deg \u003c 360` for an open\n  cylindrical arc, and `360` for a closed cylinder.\n- `layer0_radius` as the inner reference-plane radius; subsequent layer\n  reference radii are `layer0_radius + i*grid_layer_d`.\n- `panel_length_curved = layer0_radius*panel_arc_deg*pi/180` as the unfolded\n  bend length for a nonzero arc.\n\nValidate at least the flat, open-arc, and closed-cylinder states after every\nHistory change. Keep metal thickness as a separate branch: zero thickness may\nuse PEC sheets, while positive thickness uses solids; do not sweep through zero\nin a single CST run.\n\nFor complex operation sequencing and verified Bend details, use\n`cst-advanced-geometry-operations` together with this skill.\n\n## Warnings\n\n- Do not treat DXF import as the final parametric-modeling route.\n- Do not assume a giant `AnalyticalCurve` expression will scale reliably to\n  complex models.\n- Do not make one closed profile responsible for every face of a complex metal\n  surface.\n- Do not commit CST's automatically expanded project directory as source code.\n\n## Deliverables\n\nAt minimum, produce:\n\n- A rebuildable `.cst` template.\n- An `example_spiral_config.json` or equivalent parameter sample.\n- Documentation describing the control flow and pitfalls.\n- A reusable harness or checklist.\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "installer-version-naming", "title": "离线安装包版本命名规范", "description": "设计本地离线安装包时，强制程序显示名称包含版本号，并确保程序名称与软件内部版本信息一致。当用户提到\"打包安装包\"\"制作安装程序\"\"离线部署包\"\"Inno Setup\"\"NSIS\"\"安装包设计\"\"程序快捷方式\"时激活。", "category": "engineering", "audience": "codex-project", "tags": ["installer", "packaging", "versioning", "windows"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/installer-version-naming", "full_content": "---\nname: installer-version-naming\ntitle: 离线安装包版本命名规范\ndescription: 设计本地离线安装包时，强制程序显示名称包含版本号，并确保程序名称与软件内部版本信息一致。当用户提到\"打包安装包\"\"制作安装程序\"\"离线部署包\"\"Inno Setup\"\"NSIS\"\"安装包设计\"\"程序快捷方式\"时激活。\ncategory: engineering\naudience: codex-project\ntags: [installer, packaging, versioning, windows]\nstatus: active\nscore: 10.0\n---\n\n# 离线安装包版本命名规范\n\n## 核心原则\n\n用户通过桌面快捷方式或开始菜单中的程序名称即可判断当前安装的软件是否为最新版本。为此，所有本地离线安装包必须遵守以下版本可见性约束。\n\n## 强制约束\n\n### 1. 程序显示名称必须包含版本号\n\n安装后在快捷方式、开始菜单、控制面板\"程序和功能\"中显示的程序名称，必须携带完整版本号。\n\n**命名格式：**\n\n```\n\u003c程序名\u003e \u003c主版本\u003e.\u003c次版本\u003e.\u003c修订号\u003e\n```\n\n**示例：**\n\n| ✅ 正确 | ❌ 错误 |\n|---------|---------|\n| `DataSync 2.3.1` | `DataSync` |\n| `CST Antenna Tool 1.0.0` | `CST Antenna Tool` |\n| `ReportGen 3.2.0` | `ReportGen v3` |\n\n### 2. 程序名称与内部版本信息必须一致\n\n以下所有位置的版本标识必须保持完全一致：\n\n- **快捷方式名称**（桌面 / 开始菜单）\n- **控制面板 → 程序和功能 → 显示名称**（`DisplayName`）\n- **软件窗口标题栏**（如 `DataSync 2.3.1`）\n- **软件\"关于\"对话框中的版本号**\n- **安装包文件名**（如 `DataSync-Setup-2.3.1.exe`）\n- **安装目录名称**（如 `C:\\Program Files\\DataSync 2.3.1\\`）\n\n### 3. 安装包文件命名\n\n```\n\u003c程序名\u003e-Setup-\u003c版本号\u003e.exe\n```\n\n示例：`DataSync-Setup-2.3.1.exe`\n\n### 4. 版本升级时的行为\n\n- 新版本安装后，旧版本的快捷方式应被替换或移除，不得残留。\n- 若支持多版本并存，快捷方式必须各自携带版本号以区分。\n- 控制面板中不得出现同名但不同版本的重复条目。\n\n## 各打包工具的实现要点\n\n### Inno Setup\n\n```pascal\n#define MyAppName \"DataSync\"\n#define MyAppVersion \"2.3.1\"\n\n[Setup]\nAppName={#MyAppName} {#MyAppVersion}\nAppVerName={#MyAppName} {#MyAppVersion}\nDefaultDirName={autopf}\\{#MyAppName} {#MyAppVersion}\nOutputBaseFilename={#MyAppName}-Setup-{#MyAppVersion}\n\n[Icons]\nName: \"{autodesktop}\\{#MyAppName} {#MyAppVersion}\"; Filename: \"{app}\\DataSync.exe\"\nName: \"{group}\\{#MyAppName} {#MyAppVersion}\"; Filename: \"{app}\\DataSync.exe\"\n```\n\n### NSIS\n\n```nsis\n!define APP_NAME \"DataSync\"\n!define APP_VERSION \"2.3.1\"\n\nName \"${APP_NAME} ${APP_VERSION}\"\nOutFile \"${APP_NAME}-Setup-${APP_VERSION}.exe\"\nInstallDir \"$PROGRAMFILES\\${APP_NAME} ${APP_VERSION}\"\n\nVIProductVersion \"${APP_VERSION}.0\"\nVIAddVersionKey \"ProductName\" \"${APP_NAME} ${APP_VERSION}\"\nVIAddVersionKey \"FileVersion\" \"${APP_VERSION}\"\n```\n\n### Python (PyInstaller + Inno Setup)\n\n```python\n# version.py — 唯一版本源\nAPP_NAME = \"DataSync\"\nAPP_VERSION = \"2.3.1\"\nAPP_DISPLAY = f\"{APP_NAME} {APP_VERSION}\"\n```\n\n窗口标题和\"关于\"对话框必须引用同一版本常量，禁止硬编码。\n\n## 检查清单\n\n每次发布安装包前，逐项确认：\n\n- [ ] 快捷方式名称包含完整版本号\n- [ ] 控制面板显示名称包含完整版本号\n- [ ] 窗口标题栏显示版本号\n- [ ] \"关于\"对话框版本号与名称一致\n- [ ] 安装包文件名包含版本号\n- [ ] 安装目录包含版本号\n- [ ] 升级安装后旧快捷方式已清理\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "matlab", "title": "matlab", "description": "Build, review, migrate, and safely plan MATLAB or GNU Octave numerical workflows, including arrays, tabular/time data, tests, projects, graphics, MAT files, and explicit Python interoperability.", "category": "engineering", "audience": "codex-project", "tags": ["matlab", "octave"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/matlab", "full_content": "﻿---\nname: matlab\ntitle: matlab\ndescription: Build, review, migrate, and safely plan MATLAB or GNU Octave numerical workflows, including arrays, tabular/time data, tests, projects, graphics, MAT files, and explicit Python interoperability.\nlicense: MIT\ncompatibility: \u003e-\n  Documentation is pinned where noted to proprietary MATLAB R2026a and free\n  GNU Octave 11.3.0. Bundled Python CLIs require Python 3.11+ and run locally\n  without MATLAB or Octave; optional MAT inventory uses scipy and/or h5py.\nmetadata:\n  version: \"1.1\"\n  last-reviewed: \"2026-07-23\"\ncategory: engineering\naudience: codex-project\ntags: [matlab, octave]\nstatus: active\nscore: 10.0\n---\n\n# MATLAB and GNU Octave\n\nUse this skill to design or review numerical code, migrate MATLAB releases,\nprepare reproducible projects, and plan trusted execution. MATLAB and GNU\nOctave are distinct products: compatibility is partial, not a license or\nbehavior guarantee.\n\n## Product and license gate\n\n- **MATLAB R2026a is proprietary.** Do not assume MATLAB, MATLAB Online, a\n  named toolbox, MATLAB Test, MATLAB Compiler, MATLAB Coder, Parallel Computing\n  Toolbox, or an add-on is installed, licensed, or available to the user.\n- **MATLAB Runtime is not MATLAB.** It runs compatible applications produced\n  with MATLAB Compiler; it cannot run arbitrary source or host MATLAB Engine\n  for Python. Building artifacts needs the applicable licensed compiler and\n  every product used by the source.\n- **GNU Octave 11.3.0 is free software under GPLv3+.** Octave packages are not\n  MATLAB toolboxes. Similar names do not imply API, numerical, graphics, or\n  licensing equivalence.\n- Ask which runtime, release, platform, installed products, and license context\n  the user actually has. Treat availability as `unknown` until confirmed.\n\n## Nonnegotiable safety boundary\n\nNever run an untrusted `.m`, `.mlx`, MEX binary, MAT file, project startup or\nshutdown action, package installer, or generated artifact. Static review does\nnot prove safety.\n\nTreat these as execution or code-loading surfaces:\n\n- `eval`, `evalin`, `assignin`, text-derived `feval`, `str2func`, callbacks,\n  timers, app callbacks, and dynamically modified paths;\n- `system`, `unix`, `dos`, shell escape `!`, Java, .NET, Python (`py.*`,\n  `pyrun`, `pyrunfile`), MEX, and native libraries;\n- `mex`, `codegen`, MATLAB Compiler, build tasks, package/project startup, and\n  generated code;\n- `load`, object deserialization (`loadobj`, custom serialization), function\n  handles, Java/System objects, and class code reachable from MAT files.\n\n`.mlx` is an opaque archive for this toolkit and MEX is native executable code.\nDo not use Python pickle for exchange. Inspect first, isolate when appropriate,\nobtain explicit approval, then invoke a user-confirmed executable and license.\n\n## Default workflow\n\n1. **Clarify target.** Record MATLAB release or Octave version, OS/architecture,\n   base product versus required toolboxes/packages, expected inputs/outputs,\n   numerical tolerances, and whether execution is authorized.\n2. **Inventory statically.** Scan `.m` files, opaque artifacts, project paths,\n   required products, and MAT headers before any runtime loads them.\n3. **Choose code form.** Prefer functions with an `arguments` block for\n   automation. Use scripts only for controlled orchestration and live scripts\n   for reviewed interactive narratives.\n4. **Make semantics explicit.** Record shapes, classes, units, missing-value\n   rules, indexing, implicit expansion, RNG algorithm/seed, tolerances, and\n   output formats.\n5. **Test without hidden state.** Keep fixtures synthetic, paths project-local,\n   graphics deterministic, and tests independent of base-workspace residue.\n6. **Plan execution.** Generate an argv plan, review startup/path effects and\n   licenses, and launch only after explicit approval outside these helpers.\n7. **Capture provenance.** Hash named inputs/code and record release, products,\n   RNG policy, tolerances, and command plan without dumping the environment.\n\n## Language and data checklist\n\n### Scripts, functions, and live scripts\n\n- Scripts share the caller/base workspace and leave variables behind.\n  Functions have local workspaces and explicit inputs/outputs.\n- Live scripts (`.mlx`) mix code and rich output but are not plain-text\n  review artifacts. Export reviewed code to `.m` for static inspection.\n- Avoid `clear all`, broad `addpath(genpath(...))`, dependence on `pwd`, global\n  variables, and silent name shadowing. Use project roots and `fullfile`.\n- Validate sizes, classes, and values in `arguments` blocks. Remember that\n  type declarations can convert inputs; validators check without converting.\n- A main function file should match the main function name. Local functions\n  are private to the file; since R2024a they can appear anywhere in a script\n  outside conditional contexts.\n\n```matlab\nfunction y = scaleSignal(x, options)\narguments\n    x (:,1) double {mustBeFinite}\n    options.Scale (1,1) double {mustBeFinite, mustBeNonzero} = 1\nend\ny = x .* options.Scale;\nend\n```\n\n### Arrays, indexing, and numerics\n\n- MATLAB uses 1-based, column-major indexing. `A(i,j)`, `A(k)`, `A(:,j)`,\n  `A{...}`, and `A.(name)` have different semantics.\n- `*`, `/`, `\\`, and `^` are matrix operations; dotted forms are\n  element-wise. Use `A\\b`, not `inv(A)*b`.\n- Since R2016b, compatible dimensions expand implicitly. Assert intended shape\n  before operations that could accidentally form an outer result.\n- Preallocate when output size is known, but do not vectorize at the cost of\n  huge temporaries or unreadable code. Measure with `timeit` or the profiler.\n- Compare floating-point results with domain-chosen absolute and relative\n  tolerances, not blanket `==` or a magic multiple of `eps`.\n- Pin both random algorithm and seed. Use named `RandStream` substreams for\n  independent parallel work; do not use time-based `rng(\"shuffle\")` for a\n  reproducibility claim.\n\n### Tables, timetables, and missing values\n\n- A `table` has named, equal-height variables that may have different types.\n  `T(rows,vars)` returns a table; `T{rows,vars}` extracts contents; `T.Var`\n  selects one variable.\n- A `timetable` additionally has row times. Sort, validate time zones and\n  uniqueness, then use `retime`/`synchronize` intentionally.\n- Missing sentinels are type-specific: `NaN`, `NaT`, `\u003cmissing\u003e`,\n  `\u003cundefined\u003e`, and empty character vectors. Integer and logical arrays have\n  no standard missing sentinel.\n- Define import options rather than relying on inference for production data.\n  Preserve units, time zones, variable names, encodings, and missing rules.\n\n## Graphics and export\n\nUse explicit figure/axes handles and `tiledlayout`; label units; set limits,\ncolor scales, font sizes, and colormaps deliberately. Prefer `exportgraphics`\nover `saveas` for publication output. In R2026a it exports raster, PDF/EPS/EMF,\nSVG, GIF, and interactive HTML; format capabilities differ. Specify\n`ContentType=\"vector\"` for suitable PDF/SVG-style output and `Resolution` for\nraster output. Review accessibility and embedded-raster behavior.\n\n## MAT files and exchange\n\n- Version 7 is the normal `save` default; `matfile` creates 7.3 by default.\n  Versions 4/6/7/7.3 differ in types, compression, and per-variable limits.\n- Version 7.3 is HDF5-based, not an arbitrary HDF5 interchange contract.\n  Partial access and chunking can help large arrays.\n- Never load an untrusted MAT file. Inventory headers/datasets first. Objects\n  can invoke class deserialization behavior; opaque/function/native content\n  requires escalation.\n- Prefer CSV/JSON/Parquet/HDF5 with a documented schema for simple exchange.\n  Do not rename pickle payloads as MAT files and do not deserialize pickle.\n\n## Projects, analysis, and tests\n\n- Use MATLAB Projects for controlled paths, startup/shutdown tasks,\n  dependencies, source control, and reproducible entry points. Review project\n  actions before opening an untrusted project.\n- `matlab.codetools.requiredFilesAndProducts` and Dependency Analyzer are\n  static approximations; dynamic dispatch can cause misses or false positives.\n  A required-product report does not prove a license is available.\n- Use Code Analyzer (`codeIssues`; legacy text workflows can use `checkcode`)\n  and `codeCompatibilityReport` before migration.\n- Base MATLAB includes script-, function-, and class-based\n  `matlab.unittest` workflows. Parallel runs require Parallel Computing\n  Toolbox. Dependency-based selection, richer quality dashboards, generated\n  tests, and advanced coverage/equivalence features can require MATLAB Test or\n  other products.\n- R2026a `runtests` automatically opens and later closes a project when target\n  tests belong to a project that is not already open. Account for startup and\n  shutdown actions before using this behavior.\n\n## Python integration, pinned to R2026a\n\n- R2026a supports 64-bit CPython 3.9-3.13 for MATLAB Interface to Python,\n  MATLAB Engine for Python, and MATLAB Compiler SDK for Python.\n- The current R2026a PyPI package reviewed here is\n  `matlabengine==26.1.12` (released 2026-05-08). It requires an installed\n  R2026a; MATLAB Runtime alone is insufficient. R2026a also ships a\n  preinstalled Engine distribution under one named `matlabroot` path.\n- Package installation does not grant MATLAB or toolbox licenses. Configure\n  one named interpreter/executable; do not print the full environment,\n  `PATH`, `PYTHONPATH`, or credentials.\n- `pyenv` controls MATLAB-to-Python interpreter selection. In-process Python\n  generally requires restarting MATLAB to switch; out-of-process Python can\n  be terminated and reconfigured.\n- Starting Engine is an explicit execution action:\n  `matlab.engine.start_matlab()` starts a MATLAB process and can check out a\n  license. Never call it merely to probe availability.\n- Verify conversion semantics for NumPy arrays, pandas DataFrames,\n  tables/timetables, strings/missing values, datetime/duration, dictionaries,\n  shape/order, and unsupported sparse/object/categorical cases.\n\n## References\n\n- [MATLAB R2026a documentation](https://www.mathworks.com/help/matlab/)\n- [MATLAB R2026a release notes](https://www.mathworks.com/help/matlab/release-notes.html)\n- [R2026a system requirements](https://www.mathworks.com/support/requirements/matlab-system-requirements.html)\n- [Python compatibility by release](https://www.mathworks.com/support/requirements/python-compatibility.html)\n- [MATLAB Engine installation](https://www.mathworks.com/help/matlab/matlab_external/install-the-matlab-engine-for-python.html)\n- [GNU Octave 11.3.0 release](https://octave.org/)\n- [GNU Octave current manual](https://docs.octave.org/latest/)\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "mcp-builder", "title": "mcp-builder", "description": "Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).", "category": "engineering", "audience": "codex-project", "tags": ["mcp", "python", "node", "typescript"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/mcp-builder", "full_content": "﻿---\nname: mcp-builder\ndescription: Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).\nlicense: Complete terms in LICENSE.txt\ncategory: engineering\naudience: codex-project\ntags: [mcp, python, node, typescript]\nstatus: active\nscore: 10.0\n---\n\n# MCP Server Development Guide\n\n## Overview\n\nCreate MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. The quality of an MCP server is measured by how well it enables LLMs to accomplish real-world tasks.\n\n---\n\n# Process\n\n## 🚀 High-Level Workflow\n\nCreating a high-quality MCP server involves four main phases:\n\n### Phase 1: Deep Research and Planning\n\n#### 1.1 Understand Modern MCP Design\n\n**API Coverage vs. Workflow Tools:**\nBalance comprehensive API endpoint coverage with specialized workflow tools. Workflow tools can be more convenient for specific tasks, while comprehensive coverage gives agents flexibility to compose operations. Performance varies by client—some clients benefit from code execution that combines basic tools, while others work better with higher-level workflows. When uncertain, prioritize comprehensive API coverage.\n\n**Tool Naming and Discoverability:**\nClear, descriptive tool names help agents find the right tools quickly. Use consistent prefixes (e.g., `github_create_issue`, `github_list_repos`) and action-oriented naming.\n\n**Context Management:**\nAgents benefit from concise tool descriptions and the ability to filter/paginate results. Design tools that return focused, relevant data. Some clients support code execution which can help agents filter and process data efficiently.\n\n**Actionable Error Messages:**\nError messages should guide agents toward solutions with specific suggestions and next steps.\n\n#### 1.2 Study MCP Protocol Documentation\n\n**Navigate the MCP specification:**\n\nStart with the sitemap to find relevant pages: `https://modelcontextprotocol.io/sitemap.xml`\n\nThen fetch specific pages with `.md` suffix for markdown format (e.g., `https://modelcontextprotocol.io/specification/draft.md`).\n\nKey pages to review:\n- Specification overview and architecture\n- Transport mechanisms (streamable HTTP, stdio)\n- Tool, resource, and prompt definitions\n\n#### 1.3 Study Framework Documentation\n\n**Recommended stack:**\n- **Language**: TypeScript (high-quality SDK support and good compatibility in many execution environments e.g. MCPB. Plus AI models are good at generating TypeScript code, benefiting from its broad usage, static typing and good linting tools)\n- **Transport**: Streamable HTTP for remote servers, using stateless JSON (simpler to scale and maintain, as opposed to stateful sessions and streaming responses). stdio for local servers.\n\n**Load framework documentation:**\n\n- **MCP Best Practices**: [📋 View Best Practices](./reference/mcp_best_practices.md) - Core guidelines\n\n**For TypeScript (recommended):**\n- **TypeScript SDK**: Use WebFetch to load `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/main/README.md`\n- [⚡ TypeScript Guide](./reference/node_mcp_server.md) - TypeScript patterns and examples\n\n**For Python:**\n- **Python SDK**: Use WebFetch to load `https://raw.githubusercontent.com/modelcontextprotocol/python-sdk/main/README.md`\n- [🐍 Python Guide](./reference/python_mcp_server.md) - Python patterns and examples\n\n#### 1.4 Plan Your Implementation\n\n**Understand the API:**\nReview the service's API documentation to identify key endpoints, authentication requirements, and data models. Use web search and WebFetch as needed.\n\n**Tool Selection:**\nPrioritize comprehensive API coverage. List endpoints to implement, starting with the most common operations.\n\n---\n\n### Phase 2: Implementation\n\n#### 2.1 Set Up Project Structure\n\nSee language-specific guides for project setup:\n- [⚡ TypeScript Guide](./reference/node_mcp_server.md) - Project structure, package.json, tsconfig.json\n- [🐍 Python Guide](./reference/python_mcp_server.md) - Module organization, dependencies\n\n#### 2.2 Implement Core Infrastructure\n\nCreate shared utilities:\n- API client with authentication\n- Error handling helpers\n- Response formatting (JSON/Markdown)\n- Pagination support\n\n#### 2.3 Implement Tools\n\nFor each tool:\n\n**Input Schema:**\n- Use Zod (TypeScript) or Pydantic (Python)\n- Include constraints and clear descriptions\n- Add examples in field descriptions\n\n**Output Schema:**\n- Define `outputSchema` where possible for structured data\n- Use `structuredContent` in tool responses (TypeScript SDK feature)\n- Helps clients understand and process tool outputs\n\n**Tool Description:**\n- Concise summary of functionality\n- Parameter descriptions\n- Return type schema\n\n**Implementation:**\n- Async/await for I/O operations\n- Proper error handling with actionable messages\n- Support pagination where applicable\n- Return both text content and structured data when using modern SDKs\n\n**Annotations:**\n- `readOnlyHint`: true/false\n- `destructiveHint`: true/false\n- `idempotentHint`: true/false\n- `openWorldHint`: true/false\n\n---\n\n### Phase 3: Review and Test\n\n#### 3.1 Code Quality\n\nReview for:\n- No duplicated code (DRY principle)\n- Consistent error handling\n- Full type coverage\n- Clear tool descriptions\n\n#### 3.2 Build and Test\n\n**TypeScript:**\n- Run `npm run build` to verify compilation\n- Test with MCP Inspector: `npx @modelcontextprotocol/inspector`\n\n**Python:**\n- Verify syntax: `python -m py_compile your_server.py`\n- Test with MCP Inspector\n\nSee language-specific guides for detailed testing approaches and quality checklists.\n\n---\n\n### Phase 4: Create Evaluations\n\nAfter implementing your MCP server, create comprehensive evaluations to test its effectiveness.\n\n**Load [✅ Evaluation Guide](./reference/evaluation.md) for complete evaluation guidelines.**\n\n#### 4.1 Understand Evaluation Purpose\n\nUse evaluations to test whether LLMs can effectively use your MCP server to answer realistic, complex questions.\n\n#### 4.2 Create 10 Evaluation Questions\n\nTo create effective evaluations, follow the process outlined in the evaluation guide:\n\n1. **Tool Inspection**: List available tools and understand their capabilities\n2. **Content Exploration**: Use READ-ONLY operations to explore available data\n3. **Question Generation**: Create 10 complex, realistic questions\n4. **Answer Verification**: Solve each question yourself to verify answers\n\n#### 4.3 Evaluation Requirements\n\nEnsure each question is:\n- **Independent**: Not dependent on other questions\n- **Read-only**: Only non-destructive operations required\n- **Complex**: Requiring multiple tool calls and deep exploration\n- **Realistic**: Based on real use cases humans would care about\n- **Verifiable**: Single, clear answer that can be verified by string comparison\n- **Stable**: Answer won't change over time\n\n#### 4.4 Output Format\n\nCreate an XML file with this structure:\n\n```xml\n\u003cevaluation\u003e\n  \u003cqa_pair\u003e\n    \u003cquestion\u003eFind discussions about AI model launches with animal codenames. One model needed a specific safety designation that uses the format ASL-X. What number X was being determined for the model named after a spotted wild cat?\u003c/question\u003e\n    \u003canswer\u003e3\u003c/answer\u003e\n  \u003c/qa_pair\u003e\n\u003c!-- More qa_pairs... --\u003e\n\u003c/evaluation\u003e\n```\n\n---\n\n# Reference Files\n\n## 📚 Documentation Library\n\nLoad these resources as needed during development:\n\n### Core MCP Documentation (Load First)\n- **MCP Protocol**: Start with sitemap at `https://modelcontextprotocol.io/sitemap.xml`, then fetch specific pages with `.md` suffix\n- [📋 MCP Best Practices](./reference/mcp_best_practices.md) - Universal MCP guidelines including:\n  - Server and tool naming conventions\n  - Response format guidelines (JSON vs Markdown)\n  - Pagination best practices\n  - Transport selection (streamable HTTP vs stdio)\n  - Security and error handling standards\n\n### SDK Documentation (Load During Phase 1/2)\n- **Python SDK**: Fetch from `https://raw.githubusercontent.com/modelcontextprotocol/python-sdk/main/README.md`\n- **TypeScript SDK**: Fetch from `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/main/README.md`\n\n### Language-Specific Implementation Guides (Load During Phase 2)\n- [🐍 Python Implementation Guide](./reference/python_mcp_server.md) - Complete Python/FastMCP guide with:\n  - Server initialization patterns\n  - Pydantic model examples\n  - Tool registration with `@mcp.tool`\n  - Complete working examples\n  - Quality checklist\n\n- [⚡ TypeScript Implementation Guide](./reference/node_mcp_server.md) - Complete TypeScript guide with:\n  - Project structure\n  - Zod schema patterns\n  - Tool registration with `server.registerTool`\n  - Complete working examples\n  - Quality checklist\n\n### Evaluation Guide (Load During Phase 4)\n- [✅ Evaluation Guide](./reference/evaluation.md) - Complete evaluation creation guide with:\n  - Question creation guidelines\n  - Answer verification strategies\n  - XML format specifications\n  - Example questions and answers\n  - Running an evaluation with the provided scripts\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "pyinstaller-external-script-bundling", "title": "PyInstaller 打包外部解释器脚本的必备模式", "description": "当 PyInstaller 应用需要在运行时通过 subprocess 调用外部解释器（CST Python、MATLAB、自定义 Python 等）执行 .py 脚本时，必须使用 --add-data 打包脚本并用 sys._MEIPASS 解析路径。当用户提到\"PyInstaller 打包\"\"CST 联动\"\"外部脚本调用\"\"subprocess 调用 worker\"\"打包后脚本找不到\"\"_MEIPASS\"时激活。", "category": "engineering", "audience": "codex-project", "tags": ["pyinstaller", "packaging", "cst", "subprocess", "worker-script", "meipass"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/pyinstaller-external-script-bundling", "full_content": "---\nname: pyinstaller-external-script-bundling\ntitle: PyInstaller 打包外部解释器脚本的必备模式\ndescription: 当 PyInstaller 应用需要在运行时通过 subprocess 调用外部解释器（CST Python、MATLAB、自定义 Python 等）执行 .py 脚本时，必须使用 --add-data 打包脚本并用 sys._MEIPASS 解析路径。当用户提到\"PyInstaller 打包\"\"CST 联动\"\"外部脚本调用\"\"subprocess 调用 worker\"\"打包后脚本找不到\"\"_MEIPASS\"时激活。\ncategory: engineering\naudience: codex-project\ntags: [pyinstaller, packaging, cst, subprocess, worker-script, meipass]\nstatus: active\nscore: 10.0\n---\n\n# PyInstaller 打包外部解释器脚本的必备模式\n\n## 问题场景\n\n主程序（PyQt6 / Tkinter / CLI）通过 `subprocess.run([external_python, worker_script, ...])` 调用外部解释器执行一个 `.py` 脚本。典型场景：\n\n- CST Studio Suite 参数化建模（CST 捆绑的 Python 执行 `cst_worker.py`）\n- MATLAB Engine 调用（MATLAB 的 Python 接口执行桥接脚本）\n- 任何\"主程序用系统 Python，worker 用另一个解释器\"的架构\n\n**开发模式下一切正常**，因为 `Path(__file__).parents[N] / \"scripts\" / \"worker.py\"` 能正确定位源码树中的脚本。\n\n**PyInstaller 打包后崩溃**，因为 `__file__` 指向 `_MEIPASS` 临时解压目录，该目录不包含源码树的 `scripts/` 子目录。\n\n## 强制规则\n\n### 规则 1：PyInstaller 构建必须包含 --add-data\n\n```powershell\n# Windows 语法：--add-data \"源路径;目标子目录\"\npyinstaller --onefile --windowed `\n    --add-data \"scripts\\cst_worker.py;slant_polarizer\\cst\" `\n    ...\n```\n\n```bash\n# Linux/macOS 语法：--add-data \"源路径:目标子目录\"\npyinstaller --onefile --windowed \\\n    --add-data \"scripts/cst_worker.py:slant_polarizer/cst\" \\\n    ...\n```\n\n**目标子目录**必须与运行时路径解析代码中的相对路径一致。\n\n### 规则 2：运行时路径解析必须兼容两种模式\n\n```python\nimport sys\nfrom pathlib import Path\n\n\ndef resolve_worker_script() -\u003e Path:\n    \"\"\"Locate worker script in both PyInstaller bundles and source trees.\"\"\"\n    # PyInstaller onefile: 脚本被解压到 _MEIPASS/\u003c目标子目录\u003e/\n    meipass = getattr(sys, \"_MEIPASS\", None)\n    if meipass:\n        candidate = Path(meipass) / \"slant_polarizer\" / \"cst\" / \"cst_worker.py\"\n        if candidate.is_file():\n            return candidate\n    # 开发模式 / editable install：从源码树相对路径定位\n    return Path(__file__).resolve().parents[3] / \"scripts\" / \"cst_worker.py\"\n```\n\n**禁止**仅使用 `Path(__file__).parents[N]` 而不检查 `_MEIPASS`。\n\n### 规则 3：构建脚本必须同步更新\n\n`build_installer.ps1`、`Makefile`、`pyproject.toml` 中的 PyInstaller 命令必须包含 `--add-data`。如果构建脚本使用变量拼接参数，确保 `--add-data` 不被条件跳过。\n\n### 规则 4：worker 脚本的 source_root 参数\n\n如果 worker 脚本接收 `source_root` 参数用于 `sys.path.insert()`，在 PyInstaller 模式下应传入 `worker_script.parent` 而非源码树路径：\n\n```python\njob = {\n    \"source_root\": str(worker_script.parent),  # ✅ 两种模式都有效\n    # \"source_root\": str(source_root / \"src\"),  # ❌ PyInstaller 下路径不存在\n}\n```\n\n## 架构设计阶段的检查清单\n\n创建新项目时，如果架构涉及\"主程序 + 外部解释器执行脚本\"，**在写第一行代码前**确认：\n\n- [ ] worker 脚本路径解析函数已设计为双模式（`_MEIPASS` + 源码树）\n- [ ] PyInstaller 构建命令已包含 `--add-data`\n- [ ] 构建脚本（`.ps1` / `Makefile` / CI workflow）已包含 `--add-data`\n- [ ] worker 脚本不依赖源码树中其他未打包的文件\n- [ ] 打包后立即测试外部脚本调用路径（不要等到安装后才测）\n\n## 常见错误模式\n\n| 错误 | 症状 | 修复 |\n|------|------|------|\n| 仅用 `Path(__file__).parents[N]` | 安装版报 `FileNotFoundError: worker.py` | 添加 `_MEIPASS` 检查 |\n| 忘记 `--add-data` | `_MEIPASS` 下找不到脚本 | 构建命令添加 `--add-data` |\n| `--add-data` 目标路径与代码不一致 | 脚本存在但路径拼接错误 | 统一目标子目录名 |\n| worker 依赖源码树其他模块 | worker 执行时 `ImportError` | 将依赖也打包，或让 worker 自包含 |\n| `--collect-data` 替代 `--add-data` | `.py` 文件不被 collect-data 收集 | `.py` 必须用 `--add-data` |\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "webapp-testing", "title": "webapp-testing", "description": "Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.", "category": "engineering", "audience": "codex-project", "tags": ["playwright", "web", "testing"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/engineering/webapp-testing", "full_content": "﻿---\nname: webapp-testing\ndescription: Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.\nlicense: Complete terms in LICENSE.txt\ncategory: engineering\naudience: codex-project\ntags: [playwright, web, testing]\nstatus: active\nscore: 10.0\n---\n\n# Web Application Testing\n\nTo test local web applications, write native Python Playwright scripts.\n\n**Helper Scripts Available**:\n- `scripts/with_server.py` - Manages server lifecycle (supports multiple servers)\n\n**Always run scripts with `--help` first** to see usage. DO NOT read the source until you try running the script first and find that a customized solution is abslutely necessary. These scripts can be very large and thus pollute your context window. They exist to be called directly as black-box scripts rather than ingested into your context window.\n\n## Decision Tree: Choosing Your Approach\n\n```\nUser task → Is it static HTML?\n    ├─ Yes → Read HTML file directly to identify selectors\n    │         ├─ Success → Write Playwright script using selectors\n    │         └─ Fails/Incomplete → Treat as dynamic (below)\n    │\n    └─ No (dynamic webapp) → Is the server already running?\n        ├─ No → Run: python scripts/with_server.py --help\n        │        Then use the helper + write simplified Playwright script\n        │\n        └─ Yes → Reconnaissance-then-action:\n            1. Navigate and wait for networkidle\n            2. Take screenshot or inspect DOM\n            3. Identify selectors from rendered state\n            4. Execute actions with discovered selectors\n```\n\n## Example: Using with_server.py\n\nTo start a server, run `--help` first, then use the helper:\n\n**Single server:**\n```bash\npython scripts/with_server.py --server \"npm run dev\" --port 5173 -- python your_automation.py\n```\n\n**Multiple servers (e.g., backend + frontend):**\n```bash\npython scripts/with_server.py \\\n  --server \"cd backend \u0026\u0026 python server.py\" --port 3000 \\\n  --server \"cd frontend \u0026\u0026 npm run dev\" --port 5173 \\\n  -- python your_automation.py\n```\n\nTo create an automation script, include only Playwright logic (servers are managed automatically):\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True) # Always launch chromium in headless mode\n    page = browser.new_page()\n    page.goto('http://localhost:5173') # Server already running and ready\n    page.wait_for_load_state('networkidle') # CRITICAL: Wait for JS to execute\n    # ... your automation logic\n    browser.close()\n```\n\n## Reconnaissance-Then-Action Pattern\n\n1. **Inspect rendered DOM**:\n   ```python\n   page.screenshot(path='/tmp/inspect.png', full_page=True)\n   content = page.content()\n   page.locator('button').all()\n   ```\n\n2. **Identify selectors** from inspection results\n\n3. **Execute actions** using discovered selectors\n\n## Common Pitfall\n\n❌ **Don't** inspect the DOM before waiting for `networkidle` on dynamic apps\n✅ **Do** wait for `page.wait_for_load_state('networkidle')` before inspection\n\n## Best Practices\n\n- **Use bundled scripts as black boxes** - To accomplish a task, consider whether one of the scripts available in `scripts/` can help. These scripts handle common, complex workflows reliably without cluttering the context window. Use `--help` to see usage, then invoke directly. \n- Use `sync_playwright()` for synchronous scripts\n- Always close the browser when done\n- Use descriptive selectors: `text=`, `role=`, CSS selectors, or IDs\n- Add appropriate waits: `page.wait_for_selector()` or `page.wait_for_timeout()`\n\n## Reference Files\n\n- **examples/** - Examples showing common patterns:\n  - `element_discovery.py` - Discovering buttons, links, and inputs on a page\n  - `static_html_automation.py` - Using file:// URLs for local HTML\n  - `console_logging.py` - Capturing console logs during automation\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "chinese-output-constraint", "title": "chinese-output-constraint", "description": "全局中文输出约束规则。强制 AI 助手在所有交互和产出中优先并完全使用中文，包括模型思考过程、最终回答、生成的文档、代码中的注释、工作流说明等。", "category": "productivity", "audience": "codex-core", "tags": ["general", "chinese"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/productivity/chinese-output-constraint", "full_content": "﻿---\nname: chinese-output-constraint\ndescription: 全局中文输出约束规则。强制 AI 助手在所有交互和产出中优先并完全使用中文，包括模型思考过程、最终回答、生成的文档、代码中的注释、工作流说明等。\ncategory: productivity\naudience: codex-core\ntags: [general, chinese]\nstatus: active\nscore: 10.0\n---\n\n# 全局中文输出约束规则 (Chinese Output Constraint)\n\n本规则旨在强制约束 AI 助手（包括 Antigravity、Gemini 及其他集成此规则的 IDE AI 助手）在任何交互、思考和产出中，均必须在最大程度上优先并完全使用中文。\n\n---\n\n## 🎯 核心约束准则\n\n### 1. 🧠 模型思考过程 (Thought Process)\n- **硬性约束**：在所有生成的 `thought`（思考过程）中，文本内容必须全部翻译为中文展示，不得出现纯英文的思考分析。\n\n### 2. 💬 最终回答与交互 (Responses \u0026 Interactivity)\n- **硬性约束**：面向用户的所有回复、段落、分析、解释以及提问，必须一律使用中文进行书写。\n- **排版规范**：中文与英文字符/数字之间应当保持一个半角空格，以提升可读性。\n\n### 3. 📝 生成的文档与工作流 (Documents \u0026 Workflows)\n- **硬性约束**：所有自动生成或修改的文档（如 Markdown 构件、PDF、DOCX、PPTX 演示文稿、README 说明书等），如无用户特别指定的语言要求，均必须以中文书写。\n- **工作流**：在 `.agent/workflows/` 下编写的所有工作流、操作指令、提示均必须完全使用中文。\n\n### 4. 💻 代码注释与文案 (Code Comments \u0026 UI Copy)\n- **硬性约束**：在编写或修改的任何编程语言代码中，**代码注释**（单行、多行及文档字符串 Docstring）必须使用中文编写，以便于阅读和维护。\n- **界面文本**：生成的前端网页或应用界面中，所有的 UI 按钮文本、提示信息、标签等默认文案在无国际化明确要求时均必须为中文。\n\n---\n\n## ⚠️ 允许使用英文的例外场景\n\n仅在以下必须使用英文的特定技术性场景下允许保留英文，但对其所做的解释说明仍须使用中文：\n1. **代码本身的语法关键字**（如 `if`, `class`, `import` 等）。\n2. **技术术语和标准缩写**（如 `URL`, `API`, `IDE`, `PGRMS`, `SQL` 等），但应尽量附带中文注释。\n3. **系统变量、系统路径、配置键名、依赖包名**。\n4. **底层系统抛出的硬性英文报错日志**（可在保留原报错的同时，用中文提供分析与解决方案）。\n", "health_status": "healthy", "health_badge": "状态极佳", "suggestion": "优秀规则：评分在安全线以上，状态极佳，无需任何改动。"}, {"name": "doc-coauthoring", "title": "doc-coauthoring", "description": "Guide users through a structured workflow for co-authoring documentation. Use when user wants to write documentation, proposals, technical specs, decision docs, or similar structured content. This workflow helps users efficiently transfer context, refine content through iteration, and verify the doc works for readers. Trigger when user mentions writing docs, creating proposals, drafting specs, or similar documentation tasks.", "category": "productivity", "audience": "codex-project", "tags": ["docs", "writing"], "status": "active", "score": 10.0, "usage_count": 0, "last_used_date": "N/A", "source_type": "custom", "path": "source/custom/productivity/doc-coauthoring", "full_content": "﻿---\nname: doc-coauthoring\ndescription: Guide users through a structured workflow for co-authoring documentation. Use when user wants to write documentation, proposals, technical specs, decision docs, or similar structured content. This workflow helps users efficiently transfer context, refine content through iteration, and verify the doc works for readers. Trigger when user mentions writing docs, creating proposals, drafting specs, or similar documentation tasks.\ncategory: productivity\naudience: codex-project\ntags: [docs, writing]\nstatus: active\nscore: 10.0\n---\n\n# Doc Co-Authoring Workflow\n\nThis skill provides a structured workflow for guiding users through collaborative document creation. Act as an active guide, walking users through three stages: Context Gathering, Refinement \u0026 Structure, and Reader Testing.\n\n## When to Offer This Workflow\n\n**Trigger conditions:**\n- User mentions writing documentation: \"write a doc\", \"draft a proposal\", \"create a spec\", \"write up\"\n- User mentions specific doc types: \"PRD\", \"design doc\", \"decision doc\", \"RFC\"\n- User seems to be starting a substantial writing task\n\n**Initial offer:**\nOffer the user a structured workflow for co-authoring the document. Explain the three stages:\n\n1. **Context Gathering**: User provides all relevant context while Claude asks clarifying questions\n2. **Refinement \u0026 Structure**: Iteratively build each section through brainstorming and editing\n3. **Reader Testing**: Test the doc with a fresh Claude (no context) to catch blind spots before others read it\n\nExplain that this approach helps ensure the doc works well when others read it (including when they paste it into Claude). Ask if they want to try this workflow or prefer to work freeform.\n\nIf user declines, work freeform. If user accepts, proceed to Stage 1.\n\n## Stage 1: Context Gathering\n\n**Goal:** Close the gap between what the user knows and what Claude knows, enabling smart guidance later.\n\n### Initial Questions\n\nStart by asking the user for meta-context about the document:\n\n1. What type of document is this? (e.g., technical spec, decision doc, proposal)\n2. Who's the primary audience?\n3. What's the desired impact when someone reads this?\n4. Is there a template or specific format to follow?\n5. Any other constraints or context to know?\n\nInform them they can answer in shorthand or dump information however works best for them.\n\n**If user provides a template or mentions a doc type:**\n- Ask if they have a template document to share\n- If they provide a link to a shared document, use the appropriate integration to fetch it\n- If they provide a file, read it\n\n**If user mentions editing an existing shared document:**\n- Use the appropriate integration to read the current state\n- Check for images without alt-text\n- If images exist without alt-text, explain that when others use Claude to understand the doc, Claude won't be able to see them. Ask if they want alt-text generated. If so, request they paste each image into chat for descriptive alt-text generation.\n\n### Info Dumping\n\nOnce initial questions are answered, encourage the user to dump all the context they have. Request information such as:\n- Background on the project/problem\n- Related team discussions or shared documents\n- Why alternative solutions aren't being used\n- Organizational context (team dynamics, past incidents, politics)\n- Timeline pressures or constraints\n- Technical architecture or dependencies\n- Stakeholder concerns\n\nAdvise them not to worry about organizing it - just get it all out. Offer multiple ways to provide context:\n- Info dump stream-of-consciousness\n- Point to team channels or threads to read\n- Link to shared documents\n\n**If integrations are available** (e.g., Slack, Teams, Google Drive, SharePoint, or other MCP servers), mention that these can be used to pull in context directly.\n\n**If no integrations are detected and in Claude.ai or Claude app:** Suggest they can enable connectors in their Claude settings to allow pulling context from messaging apps and document storage directly.\n\nInform them clarifying questions will be asked once they've done their initial dump.\n\n**During context gathering:**\n\n- If user mentions team channels or shared documents:\n  - If integrations available: Inform them the content will be read now, then use the appropriate integration\n  - If integrations not available: Explain lack of access. Suggest they enable connectors in Claude settings, or paste the relevant content directly.\n\n- If user mentions entities/projects that are unknown:\n  - Ask if connected tools should be searched to learn more\n  - Wait for user confirmation before searching\n\n- As user provides context, track what's being learned and what's still unclear\n\n**Asking clarifying questions:**\n\nWhen user signals they've done their initial dump (or after substantial context provided), ask clarifying questions to ensure understanding:\n\nGenerate 5-10 numbered questions based on gaps in the context.\n\nInform them they can use shorthand to answer (e.g., \"1: yes, 2: see #channel, 3: no because backwards compat\"), link to more docs, point to channels to read, or just keep info-dumping. Whatever's most efficient for them.\n\n**Exit condition:**\nSufficient context has been gathered when questions show understanding - when edge cases and trade-offs can be asked about without needing basics explained.\n\n**Transition:**\nAsk if there's any more context they want to provide at this stage, or if it's time to move on to drafting the document.\n\nIf user wants to add more, let them. When ready, proceed to Stage 2.\n\n## Stage 2: Refinement \u0026 Structure\n\n**Goal:** Build the document section by section through brainstorming, curation, and iterative refinement.\n\n**Instructions to user:**\nExplain that the document will be built section by section. For each section:\n1. Clarifying questions will be asked about what to include\n2. 5-20 options will be brainstormed\n3. User will indicate what to keep/remove/combine\n4. The section will be drafted\n5. It will be refined through surgical edits\n\nStart with whichever section has the most unknowns (usually the core decision/proposal), then work through the rest.\n\n**Section ordering:**\n\nIf the document structure is clear:\nAsk which section they'd like to start with.\n\nSuggest starting with whichever section has the most unknowns. For decision docs, that's usually the core proposal. For specs, it's typically the technical approach. Summary sections are best left for last.\n\nIf user doesn't know what sections they need:\nBased on the type of document and template, suggest 3-5 sections appropriate for the doc type.\n\nAsk if this structure works, or if they want to adjust it.\n\n**Once structure is agreed:**\n\nCreate the initial document structure with placeholder text for all sections.\n\n**If access to artifacts is available:**\nUse `create_file` to create an artifact. This gives both Claude and the user a scaffold to work from.\n\nInform them that the initial structure with placeholders for all sections will be created.\n\nCreate artifact with all section headers and brief placeholder text like \"[To be written]\" or \"[Content here]\".\n\nProvide the scaffold link and indicate it's time to fill in each section.\n\n**If no access to artifacts:**\nCreate a markdown file in the working directory. Name it appropriately (e.g., `decision-doc.md`, `technical-spec.md`).\n\nInform them that the initial structure with placeholders for all sections will be created.\n\nCreate file with all section headers and placeholder text.\n\nConfirm the filename has been created and indicate it's time to fill in each section.\n\n**For each section:**\n\n### Step 1: Clarifying Questions\n\nAnnounce work will begin on the [SECTION NAME] section. Ask 5-10 clarifying questions about what should be included:\n\nGenerate 5-10 specific questions based on context and section purpose.\n\nInform them they can answer in shorthand or just indicate what's important to cover.\n\n### Step 2: Brainstorming\n\nFor the [SECTION NAME] section, brainstorm [5-20] things that might be included, depending on the section's complexity. Look for:\n- Context shared that might have been forgotten\n- Angles or considerations not yet mentioned\n\nGenerate 5-20 numbered options based on section complexity. At the end, offer to brainstorm more if they want additional options.\n\n### Step 3: Curation\n\nAsk which points should be kept, removed, or combined. Request brief justifications to help learn priorities for the next sections.\n\nProvide examples:\n- \"Keep 1,4,7,9\"\n- \"Remove 3 (duplicates 1)\"\n- \"Remove 6 (audience already knows this)\"\n- \"Combine 11 and 12\"\n\n**If user gives freeform feedback** (e.g., \"looks good\" or \"I like most of it but...\") instead of numbered selections, extract their preferences and proceed. Parse what they want kept/removed/changed and apply it.\n\n### Step 4: Gap Check\n\nBased on what they've selected, ask if there's anything important missing for the [SECTION NAME] section.\n\n### Step 5: Drafting\n\nUse `str_replace` to replace the placeholder text for this section with the actual drafted content.\n\nAnnounce the [SECTION NAME] section will be drafted now based on what they've selected.\n\n**If using artifacts:**\nAfter drafting, provide a link to the artifact.\n\nAsk them to read through it and indicate what to change. Note that being specific helps learning for the next sections.\n\n**If using a file (no artifacts):**\nAfter drafting, confirm completion.\n\nInform them the [SECTION NAME] section has been drafted in [filename]. Ask them to read through it and indicate what to change. Note that being specific helps learning for the next sections.\n\n**Key instruction for user (include when drafting the first section):**\nProvide a note: Instead of editing the doc directly, ask them to indicate what to change. This helps learning of their style for future sections. For example: \"Remove the X bullet - already covered by Y\" or \"Make the third paragraph more concise\".\n\n### Step 6: Iterative Refinement\n\nAs user provides feedback:\n- Use `str_replace` to make edits (never reprint the whole doc)\n- **If using artifacts:** Provide link to artifact after each edit\n- **If using files:** Just confirm edits are complete\n- If user edits doc directly and asks to read it: mentally note the changes they made and keep them in mind for future sections (this shows their preferences)\n\n**Continue iterating** until user is satisfied with the section.\n\n### Quality Checking\n\nAfter 3 consecutive iterations with no substantial changes, ask if anything can be removed without losing important information.\n\nWhen section is done, confirm [SECTION NAME] is complete. Ask if ready to move to the next section.\n\n**Repeat for all sections.**\n\n### Near Completion\n\nAs approaching completion (80%+ of sections done), announce intention to re-read the entire document and check for:\n- Flow and consistency across sections\n- Redundancy or contradictions\n- Anything that feels like \"slop\" or generic filler\n- Whether every sentence carries weight\n\nRead entire document and provide feedback.\n\n**When all sections are drafted and refined:**\nAnnounce all sections are drafted. Indicate intention to review the complete document one more time.\n\nReview for overall coherence, flow, completeness.\n\nProvide any final suggestions.\n\nAsk if ready to move to Reader Testing, or if they want to refine anything else.\n\n## Stage 3: Reader Testing\n\n**Goal:** Test the document with a fresh Claude (no context bleed) to verify it works for readers.\n\n**Instructions to user:**\nExplain that testing will now occur to see if the document actually works for readers. This catches blind spots - things that make sense to the authors but might confuse others.\n\n### Testing Approach\n\n**If access to sub-agents is available (e.g., in Claude Code):**\n\nPerform the testing directly without user involvement.\n\n### Step 1: Predict Reader Questions\n\nAnnounce intention to predict what questions readers might ask when trying to discover this document.\n\nGenerate 5-10 questions that readers would realistically ask.\n\n### Step 2: Test with Sub-Agent\n\nAnnounce that these questions will be tested with a fresh Claude instance (no context from this conversation).\n\nFor each question, invoke a sub-agent with just the document content and the question.\n\nSummarize what Reader Claude got right/wrong for each question.\n\n### Step 3: Run Additional Checks\n\nAnnounce additional checks will be performed.\n\nInvoke sub-agent to check for ambiguity, false assumptions, contradictions.\n\nSummarize any issues found.\n\n### Step 4: Report and Fix\n\nIf issues found:\nReport that Reader Claude struggled with specific issues.\n\nList the specific issues.\n\nIndicate intention to fix these gaps.\n\nLoop back to refinement for problematic sections.\n\n---\n\n**If no access to sub-agents (e.g., claude.ai web interface):**\n\nThe user will need to do the testing manually.\n\n### Step 1: Predict Reader Questions\n\nAsk what questions people might ask when trying to discover this document. What would they type into Claude.ai?\n\nGenerate 5-10 questions that readers would realistically ask.\n\n### Step 2: Setup Testing\n\nProvide testing instructions:\n1
