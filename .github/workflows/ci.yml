name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: python -m py_compile scripts/pgrms.py scripts/compiler.py scripts/utils.py scripts/dashboard.py scripts/evaluator.py scripts/fetcher.py scripts/validate_repository.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate repository structure
        run: python scripts/validate_repository.py
